  # Graph Explorer - Visual Neptune/Gremlin graph exploration UI
  graph-explorer:
    image: public.ecr.aws/neptune/graph-explorer:latest
    profiles: [tools]
    ports:
      - "18080:80"
    environment:
      HOST: localhost
      PROXY_SERVER_HTTPS_CONNECTION: "false"
      GRAPH_EXP_HTTPS_CONNECTION: "false"
      GRAPH_TYPE: gremlin
      PUBLIC_OR_PROXY_ENDPOINT: "http://localhost:18080"
      USING_PROXY_SERVER: "false"
      GRAPH_CONNECTION_URL: "http://neptune-local:8182"
    depends_on:
      neptune-local:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mosaic 
      - edge 

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.graph.rule=Host(`graph.m5.build-it.xyz`)"
      - "traefik.http.routers.graph.service=graph@internal"
      - "traefik.http.routers.graph.entrypoints=websecure"
      - "traefik.http.routers.graph.tls=true"

networks:
  mosaic:
    name: mosaic
  edge:
    external: true

volumes:
  postgres-data:
    driver: local
  web-node-modules:
    driver: local
  media-data:
    driver: local
  neptune-data:
    driver: local

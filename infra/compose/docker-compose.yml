# Mosaic Life - Simplified Local Development Stack
#
# Services: PostgreSQL + Backend API + Frontend Dev Server
# Startup time: <10 seconds
# Memory usage: ~300MB
#
# Quick start:
#   docker compose up -d
#   Frontend: http://localhost:5173 (Vite dev server with HMR)
#   Backend:  http://localhost:8080 (FastAPI with auto-reload)
#   API Docs: http://localhost:8080/docs
#   Postgres: localhost:25432

services:
  # Backend API (FastAPI)
  core-api:
    build:
      context: ../../services/core-api
      dockerfile: Dockerfile
    
    # Load environment variables from .env file
    env_file:
      - .env
    networks:
      - mosaic
      - edge

    # Environment variables can be overridden here if needed
    # Uncomment and modify as necessary for specific deployments
    # environment:
    #   ENV: dev
    #   LOG_LEVEL: debug
    #   DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/mosaic
    #   GOOGLE_CLIENT_ID: your-client-id.apps.googleusercontent.com
    #   GOOGLE_CLIENT_SECRET: your-client-secret
    #   APP_URL: http://localhost:5173
    #   API_URL: http://localhost:8080
    #   SESSION_SECRET_KEY: dev-secret-key-change-in-production-use-openssl-rand-hex-32
    #   S3_MEDIA_BUCKET: mosaic-life-media-dev
    #   AWS_REGION: us-east-1

    ports:
      - "8080:8080"

    volumes:
      # Mount source code for hot reload (development only)
      - ../../services/core-api/app:/app/app:ro
      - ../../services/core-api/alembic:/app/alembic:ro
      - ../../services/core-api/tests:/app/tests:ro
      # Media storage volume for local development
      - media-data:/app/media
      # Mount AWS credentials for Bedrock access (uses host's STS credentials)
      - ~/.aws:/root/.aws:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mosaicapi.rule=Host(`mosaicapi.m5.build-it.xyz`)"
      - "traefik.http.routers.mosaicapi.service=core-api-compose@docker"
      - "traefik.http.routers.mosaicapi.entrypoints=websecure"
      - "traefik.http.routers.mosaicapi.tls=true"

  # Frontend Dev Server (Vite with HMR)
  web:
    image: node:22.22.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    
    # Load environment variables from .env file
    env_file:
      - .env
    
    # VITE_BACKEND_URL is overridden here so the Vite server-side proxy uses the
    # internal Docker service name rather than the external Traefik hostname.
    environment:
      VITE_BACKEND_URL: "http://core-api:8080"

    networks:
      - mosaic
      - edge

    ports:
      - "5173:5173"
    volumes:
      # Mount entire web app for hot reload
      - ../../apps/web:/app
      # Use named volume for node_modules (faster on non-Linux)
      - web-node-modules:/app/node_modules
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mosaicweb.rule=Host(`mosaic.m5.build-it.xyz`)"
      - "traefik.http.routers.mosaicweb.service=web-compose@docker"
      - "traefik.http.routers.mosaicweb.entrypoints=websecure"
      - "traefik.http.routers.mosaicweb.tls=true"

  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16

    # Load environment variables from .env file
    env_file:
      - .env

    networks:
      - mosaic 

    # Environment variables can be overridden here if needed
    # Uncomment and modify as necessary for specific deployments
    # environment:
    #   POSTGRES_USER: postgres
    #   POSTGRES_PASSWORD: postgres
    #   POSTGRES_DB: mosaic
    #   PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "25432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
#      - ./init-litellm-db.sql:/docker-entrypoint-initdb.d/02-init-litellm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mosaic"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Graph Database (TinkerPop Gremlin Server - Neptune-compatible local dev)
  neptune-local:
    image: tinkerpop/gremlin-server:3.7.3
    container_name: mosaic-neptune-local
    networks:
      - mosaic 
      - edge 

    ports:
      - "18182:8182"
    volumes:
      - neptune-data:/opt/gremlin-server/data
      - ./neptune-local:/opt/gremlin-server/conf/neptune-local:ro
    entrypoint: ["/bin/bash", "-c", "cp /opt/gremlin-server/conf/neptune-local/gremlin-server.yaml /opt/gremlin-server/conf/gremlin-server.yaml && exec /docker-entrypoint.sh conf/gremlin-server.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname -i) 8182 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neptune.rule=Host(`neptune.m5.build-it.xyz`)"
      - "traefik.http.routers.neptune.service=neptune@internal"
      - "traefik.http.routers.neptune.entrypoints=websecure"
      - "traefik.http.routers.neptune.tls=true"

